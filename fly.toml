# fly.toml app configuration generated for parts-peddle-fe
app = 'parts-peddle-fe'
primary_region = 'dfw'

[build]
  builder = 'paketobuildpacks/builder:base'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[env]
  PORT = '3000'
  NODE_ENV = 'production'

[mounts]
  # No local disk persistence needed; using Supabase Storage
