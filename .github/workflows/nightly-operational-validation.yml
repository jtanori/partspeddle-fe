name: Nightly Operational Validation

on:
  schedule:
    - cron: '23 1 * * *' # Runs every day at 01:23 UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  validate-search-platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Run Search Platform Audit
        run: pnpm audit:search-platform
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          ALGOLIA_SEARCH_INDEX_NAME: ${{ secrets.ALGOLIA_SEARCH_INDEX_NAME }}

      - name: Upload Operational Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operational-validation-reports
          path: governance/certification/reports/
          retention-days: 90
