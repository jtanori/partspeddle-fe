# fly.toml app configuration file generated for partspeddle-fe on 2026-07-01T02:10:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'partspeddle-fe'
primary_region = 'sjc'

[build]
  builder = 'paketobuildpacks/builder:base'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
