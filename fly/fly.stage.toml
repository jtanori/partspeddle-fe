# Staging configuration for VinTrack (Next.js 16 + App Router)
# Deployed from the `develop` branch via CI, or locally with:
#   pnpm deploy:staging
#   bash scripts/deploy.sh staging
app = "vintrack-stage"

primary_region = "sjc"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]
